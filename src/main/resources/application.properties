# MongoDB Atlas connection 
 spring.data.mongodb.uri=mongodb+srv://sharmakavya_db_user:test@demo.jdwhnvo.mongodb.net/ecomdb
# spring.data.mongodb.uri=mongodb://invalidhost:27017/ecomdb

# App secrets - replace with strong secrets in production
app.security.jwt-secret=change_this_to_a_very_long_secret_or_set_env_VAR
app.security.jwt-expiration-ms=3600000
app.security.aes-secret=change_this_to_any_string_used_to_derive_aes_key

# Server port (optional)
server.port=8080

# Optional: pretty print JSON for debugging
spring.jackson.serialization.indent_output=true


# Expose actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents

# Resilience4j configuration for testing
resilience4j.circuitbreaker.instances.productService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.productService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.productService.automaticTransitionFromOpenToHalfOpenEnabled=true

