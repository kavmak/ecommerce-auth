 spring.data.mongodb.uri=mongodb+srv://sharmakavya_db_user:test@demo.jdwhnvo.mongodb.net/ecomdb
# spring.data.mongodb.uri=mongodb://invalidhost:27017/ecomdb

# App secrets - replace with strong secrets in production
app.security.jwt-secret=change_this_to_a_very_long_secret_or_set_env_VAR
app.security.jwt-expiration-ms=3600000
app.security.aes-secret=change_this_to_any_string_used_to_derive_aes_key

# Server port (optional)
server.port=8080

# Optional: pretty print JSON for debugging
spring.jackson.serialization.indent_output=true


# Resilience4j Circuit Breaker Config
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.sliding-window-size=5
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.productService.automatic-transition-from-open-to-half-open-enabled=true
